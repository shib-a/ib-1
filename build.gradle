plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id("com.github.spotbugs") version "6.5.12"
    id("org.owasp.dependencycheck") version "13.0.0"
}

group = 'org.itmo'
version = '0.0.1-SNAPSHOT'
description = 'ib-1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import org.owasp.dependencycheck.*
spotbugs {
    effort = Effort.valueOf("MAX")
    reportLevel = Confidence.valueOf("MEDIUM")
    ignoreFailures = false
    excludeFilter = file("spotbugs-exclude.xml")
}

tasks.spotbugsMain {
    reports.create("html") {
        required = true
        outputLocation.set(layout.buildDirectory.file("reports/spotbugs/main.html"))
    }
    reports.create("sarif") {
        required = true
        outputLocation.set(layout.buildDirectory.file("reports/spotbugs/main.sarif"))
    }
}

tasks.spotbugsTest { enabled = false }

dependencyCheck {
    nvd { apiKey = System.getenv("NVD_API_KEY") }
    data { directory = System.getProperty("user.home") + "/.dependency-check-data" }
    failBuildOnCVSS = 7.0f
    formats = List.of("HTML", "JSON", "SARIF")
    analyzers { ossIndex { enabled = false } }
}

repositories {
    mavenCentral()
}

dependencies {
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
