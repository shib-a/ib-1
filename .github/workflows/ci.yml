name: ib-pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotbugs:
    name: SAST (spotbugs)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: run spotbugs
        run: ./gradlew spotbugsMain

      - name: upload sarif
        if: always() && hashFiles('build/reports/spotbugs/main.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs

      - name: upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          if-no-files-found: ignore

  dependency-check:
    name: SCA (dependency-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: get date
        id: date
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: cache vulnerability db
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dc-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: dc-db-${{ runner.os }}-

      - name: run dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: List reports
        if: always()
        run: ls -la build/reports/

      - name: upload sarif
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: dependency-check

      - name: upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore

  security-gate:
    name: summary
    needs: [spotbugs, dependency-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "spotbugs:         ${{ needs.spotbugs.result }}"
          echo "dependency-check: ${{ needs.dependency-check.result }}"
          if echo "${{ needs.spotbugs.result }} ${{ needs.dependency-check.result }}" \
               | grep -qE 'failure|cancelled'; then
            exit 1
          fi
